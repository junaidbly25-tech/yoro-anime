<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infigends</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }
            #home-page {
            background-color: #222222;
            width: 100%;
            height: 100vh;
            position: relative;
            box-sizing: border-box;
            padding: 20px;
        }
        #target-page {
            background-color: #00008b;
            width: 100%;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .sky-btn {
            background-color: transparent;
            border: 3px solid #00bfff;
            color: #00bfff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: bold;
            transition: 0.2s ease;
        }
            .sky-btn:hover {
            background-color: #00bfff;
            color: #222222;
        }
        #music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            font-size: 14px;
        }
        #center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            font-size: 14px;
            text-transform: lowercase;
        }
        #target-page h1 {
            color: #ffffff;
            font-size: 3rem;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #00ffff; /* Shining effect */
            margin: 0;
            text-transform: lowercase;
        }
    </style>
</head>
<body>
    <div id="home-page">
        <button id="music-btn" class="sky-btn" onclick="showTargetPage()">music</button>
        <button id="center-btn" class="sky-btn" onclick="showTargetPage()">lets begin</button>
    </div>
    <div id="target-page">
        <h1>yoro shenosake</h1>
    </div>

    <script>
        function showTargetPage() {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('target-page').style.display = 'flex';
        }
    </script>
