<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoro Shenosake</title>
    <style>
        
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #222222;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
             }

        
        .circ-btn {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: transparent;
            border: 4px solid #00bfff; 
            color: #00bfff;
            font-size: 14px;
            font-weight: bold;
            text-transform: lowercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s, transform 0.2s;
        }

        .circ-btn:hover {
            background-color: #00bfff;
            color: #222222;
            transform: scale(1.05);
        }

        #credits-btn {
            top: 25px;
            right: 25px;
        }


        #center-btn {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            text-align: center;
            padding: 10px;
        }
        
        #center-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }

    
        .target-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #00008b; 
            display: none; 
            align-items: center;
            justify-content: center;
        }

        
        .shining-text {
            color: #ffffff;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #00bfff, 0 0 30px #00bfff;
            text-align: center;
            padding: 20px;
        }

    
        .lowercase-text {
            text-transform: lowercase;
        }
            .uppercase-text {
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    
    <button id="credits-btn" class="circ-btn" onclick="showPage('credits-page')">credits</button>
    <button id="center-btn" class="circ-btn" onclick="showPage('begin-page')">lets begin</button>

    
    <div id="begin-page" class="target-page">
        <b><u><h1 class="shining-text uppercase-text">infigends:the awakening</h1></u></b>
    </div>

    
    <div id="credits-page" class="target-page">
        <h1 class="shining-text uppercase-text">all credits goes to mdju</h1>
    </div>

    <script>
     function showPage(pageId) {
            // Hide the initial interface buttons
            document.getElementById('credits-btn').style.display = 'none';
            document.getElementById('center-btn').style.display = 'none';
            
            // Switch body background to dark blue
            document.body.style.backgroundColor = '#00008b';
            
            // Display the selected target page container
            document.getElementById(pageId).style.display = 'flex';
        }
    </script>
</body>
</html>
